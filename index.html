<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☘️霓要記得記帳</title>
    <style>
        body { font-family: "微軟正黑體", sans-serif; background-color: #F7F4F0; color: #5C544E; max-width: 480px; margin: 0 auto; padding: 20px; }
        .container { background: #FFFFFF; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(184, 174, 166, 0.2); }
        h2 { text-align: center; color: #8B7355; margin-top: 0; font-weight: 600; letter-spacing: 2px; }
        
        /* 帳本切換開關 */
        .ledger-tabs { display: flex; margin-bottom: 20px; border-radius: 8px; overflow: hidden; border: 1px solid #E6E2DD; }
        .ledger-tab { flex: 1; text-align: center; padding: 12px; background: #FCFBF9; cursor: pointer; font-weight: bold; color: #8C847D; transition: 0.3s; }
        .ledger-tab.active { background: #8B7355; color: white; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; color: #8C847D; }
        input, select { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #E6E2DD; border-radius: 8px; font-size: 16px; background-color: #FCFBF9; color: #5C544E; outline: none; }
        input:focus, select:focus { border-color: #C0A991; }
        button { width: 100%; margin-top: 10px; padding: 14px; background-color: #8B7355; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; letter-spacing: 1px; transition: 0.2s; }
        button:hover { background-color: #735F46; }
        button:disabled { background-color: #D3CBC3; }
        
        .radio-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .radio-btn { flex: 1; text-align: center; padding: 10px; border-radius: 8px; border: 1px solid #E6E2DD; cursor: pointer; font-weight: bold; transition: 0.2s; color: #8C847D; }
        .radio-btn.active-expense { background-color: #C87A7E; color: white; border-color: #C87A7E; }
        .radio-btn.active-income { background-color: #6B8E6B; color: white; border-color: #6B8E6B; }

        .balance-box { font-size: 20px; font-weight: bold; text-align: center; margin: 15px 0; color: #5C544E; background: #F7F4F0; padding: 15px; border-radius: 8px; }

        .list-header { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        .delete-btn { width: auto; padding: 6px 12px; margin: 0; background-color: transparent; color: #C87A7E; border: 1px solid #C87A7E; font-size: 12px; border-radius: 6px; }
        .delete-btn:hover { background-color: #C87A7E; color: white; }
        
        .record-item { background: #FCFBF9; border-radius: 12px; padding: 15px; margin-bottom: 12px; border-left: 5px solid #ccc; display: flex; justify-content: space-between; align-items: center; }
        .record-expense { border-left-color: #C87A7E; }
        .record-income { border-left-color: #6B8E6B; }
        .record-info { display: flex; flex-direction: column; gap: 4px; }
        .record-title { font-weight: bold; font-size: 16px; }
        .record-detail { font-size: 13px; color: #8C847D; }
        .record-amount { font-size: 18px; font-weight: bold; }
        .amount-expense { color: #C87A7E; }
        .amount-income { color: #6B8E6B; }
        #loading { text-align: center; font-size: 14px; color: #8C847D; display: none; margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>☘️霓要記得記帳</h2>

    <div class="ledger-tabs">
        <div class="ledger-tab active" id="tab-twd" onclick="setLedger('TWD')">🇹🇼 日常台幣</div>
        <div class="ledger-tab" id="tab-krw" onclick="setLedger('KRW')">🇰🇷 批發韓幣</div>
    </div>
    
    <div class="radio-group">
        <div class="radio-btn active-expense" id="btn-expense" onclick="setType('支出')">支出</div>
        <div class="radio-btn" id="btn-income" onclick="setType('收入')">收入</div>
    </div>

    <form id="form">
        <div class="form-group">
            <label>日期</label>
            <input type="date" id="date" required>
        </div>

        <div class="form-group" id="subTypeGroup">
            <label>類型</label>
            <select id="subType" onchange="updateCategories()"></select>
        </div>

        <div class="form-group">
            <label>類別</label>
            <select id="category" required></select>
        </div>

        <div class="form-group" id="accountGroup">
            <label>帳戶來源</label>
            <select id="account" required></select>
        </div>

        <div class="form-group">
            <label>金額</label>
            <input type="number" id="amount" placeholder="輸入數字" required min="1">
        </div>

        <div class="form-group">
            <label>備註 (選填)</label>
            <input type="text" id="note" placeholder="寫點什麼...">
        </div>

        <button type="submit" id="submitBtn">記錄一筆</button>
    </form>
</div>

<div class="container" style="margin-top: 20px;">
    <div class="balance-box" id="box-twd">台幣結餘: <span id="twdBalance" style="color:#8B7355;">0</span> 元</div>
    <div class="balance-box" id="box-krw" style="display:none;">批發網結餘: <span id="krwBalance" style="color:#8B7355;">0</span> 點</div>

    <div class="list-header">
        <h3 style="color:#8B7355; margin:0;">最新紀錄</h3>
        <button class="delete-btn" id="deleteBtn" onclick="deleteLastRecord()">刪除最新一筆</button>
    </div>
    <div id="loading">連線同步中...</div>
    <div id="recordList" style="margin-top: 15px;"></div>
</div>

<script>
    const GOOGLE_API_URL = "https://script.google.com/macros/s/AKfycbyk5zgLaixBmVBwG_uICcFFq4wk6PqjD1APKqyO8TjsUnQ6KzWfS8YFlIXiDHddeker/exec";
    
    let currentType = '支出';
    let currentLedger = 'TWD';
    let globalData = [];
    document.getElementById('date').valueAsDate = new Date();

    const categoryMap = {
        '變動支出': ['早餐', '午餐', '晚餐', '點心', '宵夜', '飲料', '加油', '搭車費', '線上購物', '實體購物'],
        '固定支出': ['房租', '水費', '電費', '保險(小孩)', '保險(大人)', '汽機車牌照稅', '燃料費', '電信費', '瓦斯費', '債務還款', 'APP訂閱'],
        '小孩支出': ['尿布', '娛樂', '健康', '學雜費'],
        '選品支出': ['批發儲值(台幣)', '選品進貨', '運費', '手續費', '代墊款'], // 加了儲值台幣
        '甜點支出': ['材料進貨', '包材進貨', '運費', '手續費'],
        '其他支出': ['其他'],
        '個人收入': ['一般', '沐光毓師資', '沐光毓小幫手'],
        '甜點收入': ['私訊訂購', '表單訂購', '實體門市'],
        '選品收入': ['記事本收款', 'EasyStore 訂單', '代墊款回收'],
        '其他收入': ['其他']
    };

    function setLedger(ledger) {
        currentLedger = ledger;
        document.getElementById('tab-twd').className = ledger === 'TWD' ? 'ledger-tab active' : 'ledger-tab';
        document.getElementById('tab-krw').className = ledger === 'KRW' ? 'ledger-tab active' : 'ledger-tab';
        
        document.getElementById('box-twd').style.display = ledger === 'TWD' ? 'block' : 'none';
        document.getElementById('box-krw').style.display = ledger === 'KRW' ? 'block' : 'none';

        setType('支出'); // 切換帳本時預設回到支出
        renderList();    // 刷新下方列表
    }

    function setType(type) {
        currentType = type;
        document.getElementById('btn-expense').className = type === '支出' ? 'radio-btn active-expense' : 'radio-btn';
        document.getElementById('btn-income').className = type === '收入' ? 'radio-btn active-income' : 'radio-btn';
        
        if (currentLedger === 'TWD') {
            document.getElementById('subTypeGroup').style.display = 'block';
            document.getElementById('subType').innerHTML = type === '支出' ? 
                `<option value="變動支出">變動支出</option><option value="固定支出">固定支出</option><option value="小孩支出">小孩支出</option><option value="選品支出">選品支出</option><option value="甜點支出">甜點支出</option><option value="其他支出">其他支出</option>` : 
                `<option value="個人收入">個人收入</option><option value="甜點收入">甜點收入</option><option value="選品收入">選品收入</option><option value="其他收入">其他收入</option>`;
            
            document.getElementById('account').innerHTML = type === '支出' ? 
                ['現金', '銀行轉帳 (中國信託)', '銀行轉帳 (台新銀行)', '信用卡', 'Line Pay', 'iPass Money'].map(a => `<option value="${a}">${a}</option>`).join('') : 
                ['現金', '銀行轉帳 (中國信託)', '銀行轉帳 (台新銀行)', 'Line Pay', 'iPass Money'].map(a => `<option value="${a}">${a}</option>`).join('');
            
            updateCategories();
        } else {
            document.getElementById('subTypeGroup').style.display = 'none';
            document.getElementById('category').innerHTML = type === '支出' ? '<option value="代理下單">代理下單</option>' : '<option value="儲值">儲值</option>';
            document.getElementById('account').innerHTML = '<option value="批發網點數">批發網點數</option>';
        }
    }

    function updateCategories() {
        if (currentLedger === 'KRW') return; // 韓幣不用連動
        const subType = document.getElementById('subType').value;
        const catSelect = document.getElementById('category');
        if (categoryMap[subType]) {
            catSelect.innerHTML = categoryMap[subType].map(c => `<option value="${c}">${c}</option>`).join('');
        }
    }
    
    setLedger('TWD'); // 初始載入台幣帳本

    fetch(GOOGLE_API_URL).then(res => res.json()).then(data => {
        globalData = data;
        renderList();
    }).catch(err => console.log('讀取失敗'));

    document.getElementById('form').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        
        const date = document.getElementById('date').value;
        // 如果是韓幣，後台寫入固定的標記，方便分開算
        const subType = currentLedger === 'KRW' ? '批發網(韓幣)' : document.getElementById('subType').value;
        const category = document.getElementById('category').value;
        const account = document.getElementById('account').value;
        const amount = document.getElementById('amount').value;
        const note = document.getElementById('note').value || '-';

        btn.disabled = true; loading.style.display = 'block'; btn.innerText = '寫入中...';

        const submitUrl = `${GOOGLE_API_URL}?action=add&date=${date}&type=${currentType}&subType=${subType}&category=${category}&account=${account}&amount=${amount}&note=${note}`;

        fetch(submitUrl).then(res => res.json()).then(data => {
            globalData = data;
            renderList();
            document.getElementById('amount').value = '';
            document.getElementById('note').value = '';
            btn.disabled = false; loading.style.display = 'none'; btn.innerText = '記錄一筆';
        }).catch(err => {
            alert('連線失敗，請檢查網址');
            btn.disabled = false; loading.style.display = 'none'; btn.innerText = '記錄一筆';
        });
    });

    function deleteLastRecord() {
        if (!confirm('確定要刪除試算表裡最新的一筆紀錄嗎？')) return;
        const btn = document.getElementById('deleteBtn');
        const loading = document.getElementById('loading');
        btn.disabled = true; loading.style.display = 'block'; btn.innerText = '刪除中...';

        fetch(`${GOOGLE_API_URL}?action=deleteLast`).then(res => res.json()).then(data => {
            globalData = data;
            renderList();
            btn.disabled = false; loading.style.display = 'none'; btn.innerText = '刪除最新一筆';
        }).catch(err => {
            alert('刪除失敗，請檢查網址');
            btn.disabled = false; loading.style.display = 'none'; btn.innerText = '刪除最新一筆';
        });
    }

    function renderList() {
        const recordList = document.getElementById('recordList');
        recordList.innerHTML = '';
        let twdBal = 0;
        let krwBal = 0;

        // 計算兩個帳本的總結餘
        globalData.forEach(row => {
            const isIncome = row[1] === '收入';
            const amount = parseInt(row[5]) || 0;
            if (row[2] === '批發網(韓幣)') {
                krwBal += isIncome ? amount : -amount;
            } else {
                twdBal += isIncome ? amount : -amount;
            }
        });

        document.getElementById('twdBalance').innerText = twdBal.toLocaleString();
        document.getElementById('krwBalance').innerText = krwBal.toLocaleString();

        // 根據現在切換的帳本，過濾要顯示的紀錄
        const filteredData = globalData.filter(row => {
            if (currentLedger === 'KRW') return row[2] === '批發網(韓幣)';
            return row[2] !== '批發網(韓幣)';
        });

        if (filteredData.length === 0) {
            recordList.innerHTML = '<div style="text-align:center; color:#8C847D;">目前還沒有紀錄喔</div>';
            return;
        }

        filteredData.slice(0, 10).forEach(row => {
            const isIncome = row[1] === '收入';
            recordList.innerHTML += `
                <div class="record-item ${isIncome ? 'record-income' : 'record-expense'}">
                    <div class="record-info">
                        <span class="record-title">${row[3]} <span style="font-weight:normal; font-size:12px; background:#E6E2DD; padding:2px 6px; border-radius:4px;">${row[4]}</span></span>
                        <span class="record-detail">${row[0]} | ${row[6] !== '-' ? row[6] : '無備註'}</span>
                    </div>
                    <div class="record-amount ${isIncome ? 'amount-income' : 'amount-expense'}">
                        ${isIncome ? '+' : '-'}${parseInt(row[5]).toLocaleString()}
                    </div>
                </div>
            `;
        });
    }
</script>

</body>
</html>
