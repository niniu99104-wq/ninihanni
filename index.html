<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☘️霓要記得記帳</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h2>☘️霓要記得記帳</h2>
    
    <div class="ledger-tabs">
        <div class="ledger-tab active-twd" id="tab-twd" onclick="setLedger('TWD')">🇹🇼 日常台幣</div>
        <div class="ledger-tab" id="tab-krw" onclick="setLedger('KRW')">🇰🇷 批發韓幣</div>
    </div>
    
    <div class="radio-group">
        <div class="radio-btn active-expense" id="btn-expense" onclick="setType('支出')">支出</div>
        <div class="radio-btn" id="btn-income" onclick="setType('收入')">收入</div>
    </div>
    
    <form id="form">
        <div class="form-group">
            <label>日期</label>
            <input type="date" id="date" required>
        </div>
        
        <div class="form-group" id="subTypeGroup">
            <label>類型</label>
            <select id="subType" onchange="updateCategories()"></select>
        </div>
        
        <div class="form-group">
            <label>類別</label>
            <select id="category" required onchange="updateAccounts()"></select>
        </div>
        
        <div class="form-group" id="logisticsGroup" style="display:none; background:#F0F4F8; padding:10px; border-radius:8px; border:1px dashed #AAB8C2;">
            <label style="color:#5C6B73;">📦 物流標籤</label>
            <select id="logistics">
                <option value="賣貨便">賣貨便</option>
                <option value="店到店">店到店</option>
                <option value="郵局配送">郵局配送</option>
                <option value="新竹物流(小物)">新竹物流(小物)</option>
                <option value="新竹物流(大件)">新竹物流(大件)</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>帳戶來源</label>
            <select id="account" required onchange="updateFields()"></select>
        </div>
        
        <div class="form-group">
            <label id="mainAmountLabel">金額</label>
            <input type="text" inputmode="numeric" id="amount" class="input-expense" placeholder="輸入數字" required>
        </div>
        
        <div id="esFields" style="display:none;">
            <div class="form-group" style="background:#FFF9F0; padding:10px; border-radius:8px; border:1px dashed #FFD1A4;">
                <label style="color:#D48806;">✨ 使用購物金</label>
                <input type="text" inputmode="numeric" id="creditAmount">
            </div>
            <div class="form-group" style="background:#F0F4F8; padding:10px; border-radius:8px; border:1px dashed #AAB8C2;">
                <label style="color:#5C6B73;">📦 預付運費</label>
                <input type="text" inputmode="numeric" id="shippingAmount">
            </div>
        </div>
        
        <div id="payuniAutoFields" style="display:none; background:#F8F4F0; padding:10px; border-radius:8px; border:1px dashed #8B7355;">
            <div class="form-group">
                <label style="color:#8B7355;">📦 帳面總扣運費 (支出)</label>
                <input type="text" inputmode="numeric" id="payuniShip">
            </div>
            <p style="font-size:12px; color:#8B7355; margin-top:5px; margin-bottom:0;">※ 手續費會依「實收」自動估算 2% 記帳</p>
        </div>
        
        <div class="form-group">
            <label>備註 (選填)</label>
            <input type="text" id="note" placeholder="寫點什麼...">
        </div>
        
        <div id="loading">連線同步中...</div>
        <button type="submit" id="submitBtn">記錄一筆</button>
    </form>
</div>

<script src="script.js"></script>
</body>
</html>
