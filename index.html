<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☘️霓要記得記帳</title>
    <style>
        body { font-family: "微軟正黑體", sans-serif; background-color: #F7F4F0; color: #5C544E; max-width: 480px; margin: 0 auto; padding: 20px; }
        .container { background: #FFFFFF; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(184, 174, 166, 0.2); }
        h2 { text-align: center; color: #8B7355; margin-top: 0; font-weight: 600; letter-spacing: 2px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; color: #8C847D; }
        input, select { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #E6E2DD; border-radius: 8px; font-size: 16px; background-color: #FCFBF9; color: #5C544E; outline: none; }
        input:focus, select:focus { border-color: #C0A991; }
        button { width: 100%; margin-top: 10px; padding: 14px; background-color: #8B7355; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; letter-spacing: 1px; transition: 0.2s; }
        button:hover { background-color: #735F46; }
        button:disabled { background-color: #D3CBC3; }
        
        .radio-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .radio-btn { flex: 1; text-align: center; padding: 10px; border-radius: 8px; border: 1px solid #E6E2DD; cursor: pointer; font-weight: bold; transition: 0.2s; color: #8C847D; }
        .radio-btn.active-expense { background-color: #C87A7E; color: white; border-color: #C87A7E; }
        .radio-btn.active-income { background-color: #6B8E6B; color: white; border-color: #6B8E6B; }

        .list-header { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; }
        .delete-btn { width: auto; padding: 6px 12px; margin: 0; background-color: transparent; color: #C87A7E; border: 1px solid #C87A7E; font-size: 12px; border-radius: 6px; }
        .delete-btn:hover { background-color: #C87A7E; color: white; }
        
        .record-item { background: #FCFBF9; border-radius: 12px; padding: 15px; margin-bottom: 12px; border-left: 5px solid #ccc; display: flex; justify-content: space-between; align-items: center; }
        .record-expense { border-left-color: #C87A7E; }
        .record-income { border-left-color: #6B8E6B; }
        .record-info { display: flex; flex-direction: column; gap: 4px; }
        .record-title { font-weight: bold; font-size: 16px; }
        .record-detail { font-size: 13px; color: #8C847D; }
        .record-amount { font-size: 18px; font-weight: bold; }
        .amount-expense { color: #C87A7E; }
        .amount-income { color: #6B8E6B; }
        #loading { text-align: center; font-size: 14px; color: #8C847D; display: none; margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>☘️霓要記得記帳</h2>
    
    <div class="radio-group">
        <div class="radio-btn active-expense" id="btn-expense" onclick="setType('支出')">支出</div>
        <div class="radio-btn" id="btn-income" onclick="setType('收入')">收入</div>
    </div>

    <form id="form">
        <div class="form-group">
            <label>日期</label>
            <input type="date" id="date" required>
        </div>

        <div class="form-group" id="subTypeGroup">
            <label>類型</label>
            <select id="subType" onchange="updateCategories()">
                <option value="變動支出">變動支出</option>
                <option value="固定支出">固定支出</option>
                <option value="小孩支出">小孩支出</option>
                <option value="選品支出">選品支出</option>
                <option value="甜點支出">甜點支出</option>
                <option value="其他支出">其他支出</option>
            </select>
        </div>

        <div class="form-group">
            <label>類別</label>
            <select id="category" required></select>
        </div>

        <div class="form-group">
            <label>帳戶來源</label>
            <select id="account" required></select>
        </div>

        <div class="form-group">
            <label>金額</label>
            <input type="number" id="amount" placeholder="輸入數字" required min="1">
        </div>

        <div class="form-group">
            <label>備註 (選填)</label>
            <input type="text" id="note" placeholder="寫點什麼...">
        </div>

        <button type="submit" id="submitBtn">記錄一筆</button>
    </form>
</div>

<div class="container" style="margin-top: 20px;">
    <div class="list-header">
        <h3 style="color:#8B7355; margin:0;">最新紀錄</h3>
        <button class="delete-btn" id="deleteBtn" onclick="deleteLastRecord()">刪除最新一筆</button>
    </div>
    <div id="loading">連線同步中...</div>
    <div id="recordList" style="margin-top: 15px;"></div>
</div>

<script>
    // 🛑 把這裡換成妳的 Google Apps Script 網址
    const GOOGLE_API_URL = "https://script.google.com/macros/s/AKfycbyk5zgLaixBmVBwG_uICcFFq4wk6PqjD1APKqyO8TjsUnQ6KzWfS8YFlIXiDHddeker/exec";
    
    let currentType = '支出';
    document.getElementById('date').valueAsDate = new Date();

    const categoryMap = {
        '變動支出': ['早餐', '午餐', '晚餐', '點心', '宵夜', '飲料', '加油', '搭車費', '線上購物', '實體購物'],
        '固定支出': ['房租', '水費', '電費', '保險(小孩)', '保險(大人)', '汽機車牌照稅', '燃料費', '電信費', '瓦斯費', '債務還款', 'APP訂閱'],
        '小孩支出': ['尿布', '娛樂', '健康', '學雜費'],
        '選品支出': ['選品進貨', '運費', '手續費', '代墊款'],
        '甜點支出': ['材料進貨', '包材進貨', '運費', '手續費'],
        '其他支出': ['其他'],
        '個人收入': ['一般','沐光毓小幫手','沐光毓師資', '沐光毓小幫手'],
        '甜點收入': ['私訊訂購', '表單訂購', '實體門市'],
        '選品收入': ['記事本收款', 'EasyStore 訂單', '代墊款回收'],
        '其他收入': ['其他'],
    };

    const accountMap = {
        '支出': ['現金', '銀行轉帳', '信用卡', 'Line Pay', 'iPass Money'],
        '收入': ['現金', '銀行轉帳', 'Line Pay', 'iPass Money']
    };

    function setType(type) {
        currentType = type;
        document.getElementById('btn-expense').className = type === '支出' ? 'radio-btn active-expense' : 'radio-btn';
        document.getElementById('btn-income').className = type === '收入' ? 'radio-btn active-income' : 'radio-btn';
        document.getElementById('subTypeGroup').style.display = type === '支出' ? 'block' : 'none';
        
        // 更新帳戶來源選項
        document.getElementById('account').innerHTML = accountMap[type].map(a => `<option value="${a}">${a}</option>`).join('');
        
        updateCategories();
    }

    function updateCategories() {
        const subType = currentType === '支出' ? document.getElementById('subType').value : '收入';
        document.getElementById('category').innerHTML = categoryMap[subType].map(c => `<option value="${c}">${c}</option>`).join('');
    }
    
    // 初始化選單
    setType('支出');

    // 讀取資料
    fetch(GOOGLE_API_URL).then(res => res.json()).then(data => updateUI(data)).catch(err => console.log('讀取失敗'));

    document.getElementById('form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        
        const date = document.getElementById('date').value;
        const subType = currentType === '支出' ? document.getElementById('subType').value : '-';
        const category = document.getElementById('category').value;
        const account = document.getElementById('account').value;
        const amount = document.getElementById('amount').value;
        const note = document.getElementById('note').value || '-';

        btn.disabled = true; loading.style.display = 'block'; btn.innerText = '寫入中...';

        const submitUrl = `${GOOGLE_API_URL}?action=add&date=${date}&type=${currentType}&subType=${subType}&category=${category}&account=${account}&amount=${amount}&note=${note}`;

        fetch(submitUrl).then(res => res.json()).then(data => {
            updateUI(data);
            document.getElementById('amount').value = '';
            document.getElementById('note').value = '';
            btn.disabled = false; loading.style.display = 'none'; btn.innerText = '記錄一筆';
        }).catch(err => {
            alert('連線失敗，請檢查網址');
            btn.disabled = false; loading.style.display = 'none'; btn.innerText = '記錄一筆';
        });
    });

    function deleteLastRecord() {
        if (!confirm('確定要刪除試算表裡最新的一筆紀錄嗎？這動作無法復原喔。')) return;
        
        const btn = document.getElementById('deleteBtn');
        const loading = document.getElementById('loading');
        btn.disabled = true; loading.style.display = 'block'; btn.innerText = '刪除中...';

        fetch(`${GOOGLE_API_URL}?action=deleteLast`).then(res => res.json()).then(data => {
            updateUI(data);
            btn.disabled = false; loading.style.display = 'none'; btn.innerText = '刪除最新一筆';
        }).catch(err => {
            alert('刪除失敗，請檢查網址');
            btn.disabled = false; loading.style.display = 'none'; btn.innerText = '刪除最新一筆';
        });
    }

    function updateUI(data) {
        const recordList = document.getElementById('recordList');
        recordList.innerHTML = '';

        if (!data || data.length === 0) {
            recordList.innerHTML = '<div style="text-align:center; color:#8C847D;">目前還沒有紀錄喔</div>';
            return;
        }

        data.slice(0, 10).forEach(row => {
            const isIncome = row[1] === '收入';
            // row[2] 是 subType, row[3] 是 category, row[4] 是 account, row[5] 是 amount
            recordList.innerHTML += `
                <div class="record-item ${isIncome ? 'record-income' : 'record-expense'}">
                    <div class="record-info">
                        <span class="record-title">${row[3]} <span style="font-weight:normal; font-size:12px; background:#E6E2DD; padding:2px 6px; border-radius:4px;">${row[4]}</span></span>
                        <span class="record-detail">${row[0]} | ${row[6] !== '-' ? row[6] : '無備註'}</span>
                    </div>
                    <div class="record-amount ${isIncome ? 'amount-income' : 'amount-expense'}">
                        ${isIncome ? '+' : '-'}${row[5]}
                    </div>
                </div>
            `;
        });
    }
</script>

</body>
</html>
