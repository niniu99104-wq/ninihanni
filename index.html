<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☘️霓要記得記帳</title>
    <style>
        body { font-family: "微軟正黑體", sans-serif; background-color: #F7F4F0; color: #5C544E; max-width: 480px; margin: 0 auto; padding: 20px; }
        .container { background: #FFFFFF; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(184, 174, 166, 0.2); }
        h2 { text-align: center; color: #8B7355; margin-top: 0; font-weight: 600; letter-spacing: 2px; }
        .ledger-tabs { display: flex; margin-bottom: 20px; border-radius: 8px; overflow: hidden; border: 1px solid #E6E2DD; }
        .ledger-tab { flex: 1; text-align: center; padding: 12px; background: #FCFBF9; cursor: pointer; font-weight: bold; color: #8C847D; transition: 0.3s; }
        .ledger-tab.active { background: #8B7355; color: white; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; color: #8C847D; }
        input, select { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #E6E2DD; border-radius: 8px; font-size: 16px; background-color: #FCFBF9; color: #5C544E; outline: none; }
        .input-expense:focus { border-color: #C87A7E !important; }
        .input-income:focus { border-color: #6B8E6B !important; }
        button { width: 100%; margin-top: 10px; padding: 14px; background-color: #8B7355; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .radio-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .radio-btn { flex: 1; text-align: center; padding: 12px; border-radius: 8px; border: 1px solid #E6E2DD; cursor: pointer; font-weight: bold; transition: 0.2s; color: #8C847D; }
        .radio-btn.active-expense { background-color: #C87A7E; color: white; border-color: #C87A7E; }
        .radio-btn.active-income { background-color: #6B8E6B; color: white; border-color: #6B8E6B; }
        .balance-box { font-size: 20px; font-weight: bold; text-align: center; margin: 15px 0; color: #5C544E; background: #F7F4F0; padding: 15px; border-radius: 8px; }
        #loading { text-align: center; font-size: 14px; color: #8C847D; display: none; margin: 10px 0; }
        .record-item { background: #FCFBF9; border-radius: 12px; padding: 12px; margin-bottom: 12px; border-left: 5px solid #ccc; display: flex; justify-content: space-between; align-items: center; }
        .record-expense { border-left-color: #C87A7E; }
        .record-income { border-left-color: #6B8E6B; }
        .edit-btn { background: #E6E2DD; color: #5C544E; border: none; padding: 5px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; margin-left: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>☘️霓要記得記帳</h2>
    <div class="ledger-tabs">
        <div class="ledger-tab active" id="tab-twd" onclick="setLedger('TWD')">🇹🇼 日常台幣</div>
        <div class="ledger-tab" id="tab-krw" onclick="setLedger('KRW')">🇰🇷 批發韓幣</div>
    </div>
    <div class="radio-group">
        <div class="radio-btn active-expense" id="btn-expense" onclick="setType('支出')">支出</div>
        <div class="radio-btn" id="btn-income" onclick="setType('收入')">收入</div>
    </div>
    <form id="form">
        <div class="form-group"><label>日期</label><input type="date" id="date" required></div>
        <div class="form-group" id="subTypeGroup"><label>類型</label><select id="subType" onchange="updateCategories()"></select></div>
        <div class="form-group"><label>類別</label><select id="category" required onchange="updateAccounts()"></select></div>
        
        <div class="form-group" id="logisticsGroup" style="display:none; background:#F0F4F8; padding:10px; border-radius:8px; border:1px dashed #AAB8C2;">
            <label style="color:#5C6B73;">📦 物流方式</label>
            <select id="logistics" onchange="autoFillAmount()">
                <option value="賣貨便">賣貨便</option>
                <option value="店到店">店到店</option>
                <option value="郵局配送">郵局配送</option>
                <option value="新竹物流(小物)">新竹物流(小物)</option>
                <option value="新竹物流(大件)">新竹物流(大件)</option>
            </select>
        </div>

        <div class="form-group"><label>帳戶來源</label><select id="account" required></select></div>
        <div class="form-group"><label id="mainAmountLabel">金額 (總實收)</label><input type="text" inputmode="numeric" id="amount" class="input-expense" placeholder="輸入數字" required></div>
        
        <div class="form-group" id="creditGroup" style="display:none; background:#FFF9F0; padding:10px; border-radius:8px; border:1px dashed #FFD1A4; margin-bottom:15px;">
            <label style="color:#D48806;">✨ 使用購物金金額</label>
            <input type="text" inputmode="numeric" id="creditAmount" placeholder="沒用就留空">
        </div>
        <div class="form-group" id="esShippingGroup" style="display:none; background:#F0F4F8; padding:10px; border-radius:8px; border:1px dashed #AAB8C2; margin-bottom:15px;">
            <label style="color:#5C6B73;">📦 客人預付運費 (純紀錄，不自動扣款)</label>
            <input type="text" inputmode="numeric" id="esShippingAmount" placeholder="客人付的運費 (如: 60)">
        </div>

        <div class="form-group"><label>備註 (選填)</label><input type="text" id="note" placeholder="寫點什麼..."></div>
        <input type="hidden" id="editRowId" value="">
        <button type="submit" id="submitBtn">記錄一筆</button>
    </form>
</div>

<div class="container" style="margin-top: 20px;">
    <div class="balance-box" id="box-twd">台幣結餘: <span id="twdBalance" style="color:#8B7355;">0</span> 元</div>
    <div class="balance-box" id="box-krw" style="display:none;">批發網結餘: <span id="krwBalance" style="color:#8B7355;">0</span> 點</div>
    <div id="loading">連線同步中...</div>
    <div id="recordList" style="margin-top: 15px;"></div>
</div>

<script>
    const GOOGLE_API_URL = "https://script.google.com/macros/s/AKfycbyk5zgLaixBmVBwG_uICcFFq4wk6PqjD1APKqyO8TjsUnQ6KzWfS8YFlIXiDHddeker/exec";
    let currentType = '支出', currentLedger = 'TWD', globalData = [];
    document.getElementById('date').valueAsDate = new Date();

    const categoryMap = {
        '支出': {
            '變動支出': ['交通費', '線上購物', '實體購物', '早餐/午餐/晚餐', '點心/宵夜/飲料'],
            '固定支出': ['房租', '瓦斯費', '電信費', '燃料費', '債務還款', 'APP訂閱', '水費/電費', '保險(小孩)', '保險(大人)', '汽機車牌照稅'],
            '小孩支出': ['尿布', '健康', '娛樂', '學雜費'],
            '甜點支出': ['運費', '手續費', '包材進貨', '材料進貨'],
            '選品支出 (零售)': ['手續費', '選品進貨', '藍新沖銷', '國際運費', '國內運費', '斷貨退款', '活動購物金'],
            '代理支出 (批發)': ['代墊款', '斷貨退款', '國際運費', '國內運費', '批發儲值(台幣)'],
            '其他支出': ['其他']
        },
        '收入': {
            '個人收入': ['一般', '沐光毓師資', '沐光毓小幫手'],
            '甜點收入': ['實體門市', '私訊訂購', '表單訂購'],
            '選品收入 (零售)': ['現貨出清', '記事本收款', 'EasyStore 訂單'],
            '代理收入 (批發)': ['倉庫整理費', '代墊款回收', '國際運費收回', '國內運費收回'],
            '其他收入': ['其他']
        }
    };

    function setLedger(l) { 
        currentLedger = l; 
        setType('支出'); 
        renderList(); 
        document.getElementById('tab-twd').className = l==='TWD'?'ledger-tab active':'ledger-tab'; 
        document.getElementById('tab-krw').className = l==='KRW'?'ledger-tab active':'ledger-tab'; 
        document.getElementById('box-twd').style.display = l==='TWD'?'block':'none'; 
        document.getElementById('box-krw').style.display = l==='KRW'?'block':'none'; 
    }

    function setType(t) { 
        currentType = t; 
        document.getElementById('btn-expense').className = t==='支出'?'radio-btn active-expense':'radio-btn';
        document.getElementById('btn-income').className = t==='收入'?'radio-btn active-income':'radio-btn';
        document.getElementById('amount').className = t==='支出'?'input-expense':'input-income';
        if (currentLedger === 'TWD') {
            document.getElementById('subTypeGroup').style.display='block';
            const subs = Object.keys(categoryMap[t]);
            document.getElementById('subType').innerHTML = subs.map(s => `<option value="${s}">${s}</option>`).join('');
            updateCategories(); 
        } else {
            document.getElementById('subTypeGroup').style.display='none';
            document.getElementById('category').innerHTML = t==='支出'?'<option value="代理下單">代理下單</option>':'<option value="儲值">儲值</option>';
            document.getElementById('account').innerHTML = '<option value="批發網點數">批發網點數</option>';
            document.getElementById('creditGroup').style.display = 'none';
            document.getElementById('esShippingGroup').style.display = 'none';
        }
    }

    function updateCategories() {
        if (currentLedger === 'KRW') return;
        const sub = document.getElementById('subType').value;
        const cats = categoryMap[currentType][sub];
        document.getElementById('category').innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('');
        updateAccounts();
    }

    function updateAccounts() {
        if (currentLedger === 'KRW') return;
        const cat = document.getElementById('category').value;
        const accSelect = document.getElementById('account');
        const isES = (cat === 'EasyStore 訂單');

        document.getElementById('creditGroup').style.display = isES ? 'block' : 'none';
        document.getElementById('esShippingGroup').style.display = isES ? 'block' : 'none';
        document.getElementById('logisticsGroup').style.display = (currentType === '支出' && (cat === '國內運費' || cat === '運費')) ? 'block' : 'none';

        let list = ['現金', '信用卡', 'Line Pay', 'iPass Money', '銀行轉帳 (中國信託)', '銀行轉帳 (台新銀行)'];
        if (isES) list = ['Line Pay', '藍新待撥款', '銀行轉帳 (中國信託)', '銀行轉帳 (台新銀行)'];
        else if (cat === '記事本收款') list = ['Line Pay', 'iPass Money', '銀行轉帳 (台新銀行)'];
        else if (cat === '藍新沖銷') list = ['銀行轉帳 (中國信託)'];
        else if (cat === '活動購物金') list = ['ES購物金'];
        else if (cat === '斷貨退款') list = ['ES購物金', '批發網點數', '銀行轉帳 (中國信託)', '銀行轉帳 (台新銀行)'];

        list.sort((a, b) => a.length - b.length);
        accSelect.innerHTML = list.map(a => `<option value="${a}">${a}</option>`).join('');
        autoFillAmount();
    }

    function autoFillAmount() {
        const amtInput = document.getElementById('amount');
        if (document.getElementById('logisticsGroup').style.display === 'block') {
            const logi = document.getElementById('logistics').value;
            if (logi === '賣貨便') amtInput.value = '38';
            else if (logi === '店到店') amtInput.value = '60';
        }
    }

    function editRecord(rowIdx) {
        const r = globalData[rowIdx];
        document.getElementById('date').value = r[0];
        setType(r[1]);
        setTimeout(() => {
            document.getElementById('subType').value = r[2];
            updateCategories();
            document.getElementById('category').value = r[3];
            updateAccounts();
            document.getElementById('account').value = r[4];
            document.getElementById('amount').value = r[5];
            document.getElementById('note').value = r[6];
            document.getElementById('submitBtn').innerText = "確認修改 (會刪除舊紀錄)";
            document.getElementById('editRowId').value = r[7];
        }, 100);
    }
    
    fetch(GOOGLE_API_URL).then(r=>r.json()).then(d=>{globalData=d; renderList();});

    document.getElementById('form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const amt = parseInt(document.getElementById('amount').value.replace(/\D/g,'')) || 0;
        const creditAmt = parseInt(document.getElementById('creditAmount').value.replace(/\D/g,'')) || 0;
        const esShippingAmt = parseInt(document.getElementById('esShippingAmount').value.replace(/\D/g,'')) || 0;
        const note = document.getElementById('note').value;
        const sub = currentLedger === 'KRW' ? '批發網(韓幣)' : document.getElementById('subType').value;
        const cat = document.getElementById('category').value;
        const acc = document.getElementById('account').value;
        const date = document.getElementById('date').value;
        const btn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');

        btn.disabled = true; loading.style.display = 'block';

        const sendReq = async (d, t, st, c, a, am, n) => {
            const res = await fetch(`${GOOGLE_API_URL}?action=add&date=${d}&type=${t}&subType=${st}&category=${c}&account=${a}&amount=${am}&note=${n}`);
            return await res.json();
        };

        try {
            if (currentType === '收入' && cat === 'EasyStore 訂單') {
                // 將運費純紀錄在備註裡
                let finalNote = note;
                if (esShippingAmt > 0) {
                    finalNote = note ? `[含運費${esShippingAmt}] ${note}` : `[含運費${esShippingAmt}]`;
                }

                // 1. 記總實收收入 (含運費標籤)
                await sendReq(date, '收入', sub, cat, acc, amt, finalNote);
                
                // 2. 記購物金回收收入 (有填寫才記)
                if (creditAmt > 0) {
                    await sendReq(date, '收入', sub, cat, 'ES購物金', creditAmt, `(訂單扣抵)${finalNote}`);
                }
                
                // 3. 記刷卡手續費支出 (只扣藍新)
                if (acc === '藍新待撥款') {
                    await sendReq(date, '支出', '選品支出 (零售)', '手續費', acc, Math.round(amt*0.028), `(2.8%手續費)${finalNote}`);
                }
                
                // 重新抓取資料更新畫面
                globalData = await fetch(GOOGLE_API_URL).then(r=>r.json());
                alert(`搞定！實收${amt} / 購物金${creditAmt}。運費已記在備註中！`);
                
            } else {
                let finalNote = note;
                if (currentType === '支出' && (cat === '國內運費' || cat === '運費')) {
                    const logi = document.getElementById('logistics').value;
                    finalNote = note ? `[${logi}] ${note}` : `[${logi}]`;
                }
                globalData = await sendReq(date, currentType, sub, cat, acc, amt, finalNote);
                if (document.getElementById('submitBtn').innerText.includes("修改")) {
                    alert("修正成功。");
                    document.getElementById('submitBtn').innerText = "記錄一筆";
                }
            }
            renderList(); 
            document.getElementById('amount').value=''; 
            document.getElementById('creditAmount').value=''; 
            document.getElementById('esShippingAmount').value=''; 
            document.getElementById('note').value='';
        } catch(err) { alert('連線失敗'); } finally { btn.disabled = false; loading.style.display = 'none'; }
    });

    function renderList() {
        const list = document.getElementById('recordList'); list.innerHTML = '';
        let tB = 0, kB = 0;
        if (!Array.isArray(globalData)) return;
        globalData.forEach(r => { 
            const isI = r[1] === '收入';
            const val = parseInt(String(r[5]).replace(/\D/g,'')) || 0;
            if (r[2] === '批發網(韓幣)') kB += isI ? val : -val; else tB += isI ? val : -val;
        });
        document.getElementById('twdBalance').innerText = tB.toLocaleString();
        document.getElementById('krwBalance').innerText = kB.toLocaleString();
        globalData.filter(r => currentLedger === 'KRW' ? r[2] === '批發網(韓幣)' : r[2] !== '批發網(韓幣)').slice(0,15).forEach((r, idx) => {
            const isI = r[1] === '收入';
            list.innerHTML += `<div class="record-item ${isI?'record-income':'record-expense'}"><div><b>${r[3]}</b> <small>${r[4]}</small><br><span style="font-size:12px">${r[0]} | ${r[6]||'無'}</span></div><div style="text-align:right"><b>${isI?'+':'-'}${parseInt(r[5]).toLocaleString()}</b><br><button class="edit-btn" onclick="editRecord(${idx})">🖊️ 改</button></div></div>`;
        });
    }
</script>
</body>
</html>
